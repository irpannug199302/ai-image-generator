<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Image Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>✨ AI Image Generator</h1>

    <p class="subtitle">
        Buat gambar AI dengan mudah
    </p>

    <div class="card">

        <label>📷 Foto Model</label>

        <input
            type="file"
            id="foto"
            accept="image/*"
        >

        <label>👗 Pakaian</label>

        <select id="pakaian">

            <option>Daster</option>
            <option>Baju Tidur</option>
            <option>Kaos</option>
            <option>Kemeja</option>
            <option>Dress</option>

        </select>


        <label>🎨 Warna</label>

        <input
            type="text"
            id="warna"
            placeholder="Contoh: merah"
        >


        <label>👗 Model</label>

        <input
            type="text"
            id="model"
            placeholder="Contoh: press body"
        >


        <label>📏 Panjang</label>

        <input
            type="text"
            id="panjang"
            placeholder="Contoh: selutut"
        >


        <label>📸 Pose</label>

        <input
            type="text"
            id="pose"
            placeholder="Contoh: selfie duduk di sofa"
        >


        <label>🏠 Lokasi</label>

        <input
            type="text"
            id="lokasi"
            placeholder="Contoh: ruang tamu"
        >


        <label>📐 Rasio</label>

        <select id="rasio">

            <option value="9:16">
                9:16
            </option>

            <option value="1:1">
                1:1
            </option>

            <option value="16:9">
                16:9
            </option>

        </select>


        <button onclick="buatPrompt()">

            ✨ BUAT PROMPT

        </button>

    </div>


    <div class="card">

        <h2>Prompt AI</h2>

        <textarea
            id="hasilPrompt"
            readonly
            placeholder="Prompt akan muncul di sini..."
        ></textarea>


        <button onclick="salinPrompt()">

            📋 SALIN PROMPT

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
